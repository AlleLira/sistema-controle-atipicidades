
name: Gerar Executavel Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar executavel
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --console --name "Controle de Atipicidades" --add-data "templates;templates" --add-data "static;static" iniciar_sistema.py

      - name: Compactar programa
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Controle de Atipicidades/*" -DestinationPath "Controle-de-Atipicidades-Windows.zip"

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: Controle-de-Atipicidades-Windows
          path: Controle-de-Atipicidades-Windows.zip
          retention-days: 30
